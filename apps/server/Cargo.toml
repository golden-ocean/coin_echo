sys_api = { workspace = true }
sys_infrastructure = { workspace = true }

# 框架
tokio = { workspace = true }
axum = { workspace = true }
# 日志
tracing = { workspace = true }
# 数据库
sqlx = { workspace = true }
# 错误
thiserror = { workspace = true }
anyhow = { workspace = true }
# 序列化
serde = { workspace = true }
serde_json = { workspace = true }
# OpenAPI
utoipa = { workspace = true }
scalar_api_reference = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
