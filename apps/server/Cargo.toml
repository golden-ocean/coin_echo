[package]
name = "apps_server"
version = "0.1.0"
edition = "2024"

[lib]
name = "apps_server"
path = "src/lib.rs"

[[bin]]
name = "apps_server"
path = "src/main.rs"

[dependencies]
# 内部
platform_cache = { workspace = true }
platform_config = { workspace = true }
platform_database = { workspace = true }
platform_kernel = { workspace = true }
platform_middleware = { workspace = true }
platform_security = { workspace = true }
platform_telemetry = { workspace = true }

iam_api = { workspace = true }
